<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>Manipulator</title>
</head>
<body>
  <header>
    <h1>Manipulator</h1>
    <span class="version" id="version"></span>
  </header>

  <section class="setting">
    <label class="row">
      <span class="label-text">Anonymous usage analytics</span>
      <input type="checkbox" id="analytics-toggle" aria-describedby="analytics-hint">
    </label>
    <p class="hint" id="analytics-hint">
      Helps the developer understand which signals fire most often. No tweet
      content, handles, or personal data is ever collected.
    </p>
    <p class="status" id="analytics-status"></p>
  </section>

  <footer>
    <a href="#" id="privacy-link">Privacy policy</a>
    <span class="dot">·</span>
    <a href="#" id="permissions-link">Permissions</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
